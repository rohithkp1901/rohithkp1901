<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rohith K P — Live Location</title>
<style>
:root{--neon:#00ff41;--bg:#05080b}*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background:var(--bg);color:var(--neon);font-family:"Courier New",monospace;display:flex;align-items:center;justify-content:center;padding:24px 12px}body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(0,255,65,.04) 0 1px,transparent 1px 3px);pointer-events:none}.wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;width:100%}.panel{text-align:center;padding:28px 24px;border:1px solid var(--neon);border-radius:6px;box-shadow:0 0 12px rgba(0,255,65,.35),inset 0 0 20px rgba(0,255,65,.05);background:rgba(0,255,65,.02);width:min(420px,92vw)}.tag{font-size:12px;letter-spacing:3px;opacity:.8;margin-bottom:16px}.pin{font-size:clamp(13px,4vw,20px);line-height:1.5;letter-spacing:.5px;text-shadow:0 0 8px var(--neon),0 0 20px var(--neon);margin-bottom:10px;min-height:32px;overflow-wrap:break-word}.pin:before{content:"📍 "}.coords{font-size:13px;opacity:.75;margin-bottom:16px;letter-spacing:1px}.time{font-size:20px;letter-spacing:2px;margin-bottom:10px;text-shadow:0 0 6px var(--neon)}.meta{font-size:11px;letter-spacing:2px;opacity:.7}.source{margin-top:10px;font-size:10px;letter-spacing:1px;opacity:.45}.footer{margin-top:18px;font-size:10px;letter-spacing:2px;opacity:.55}.blink{animation:blink 1.4s steps(2,start) infinite}@keyframes blink{to{visibility:hidden}}@media(max-width:480px){html,body{padding:16px 8px}.panel{padding:24px 14px}.tag{font-size:10px;letter-spacing:2px}.pin{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<div class="panel"><div class="tag">👤 OWNER LOCATION · LIVE</div><div class="pin" id="my-pin">CONNECTING OWNER...</div><div class="coords" id="my-coords">--</div><div class="time" id="my-clock">00:00:00 AM</div><div class="meta" id="my-meta">OWNER AUTHENTICATION</div><div class="footer"><span class="blink">●</span>&nbsp; LIVE · FIREBASE REALTIME</div></div>
<div class="panel"><div class="tag">👥 VISITOR · YOUR LOCATION</div><div class="pin" id="you-pin">LOCATING...</div><div class="coords" id="you-coords">--</div><div class="time" id="you-clock">00:00:00 AM</div><div class="meta" id="you-meta">--</div><div class="source" id="you-source"></div><div class="footer"><span class="blink">●</span>&nbsp; PRIVATE · GPS</div></div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithPopup,signOut,signInAnonymously,GithubAuthProvider}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import{getDatabase,ref,onValue,set,onDisconnect,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig={apiKey:"AIzaSyAOaCQ9boh4bB_mZ6anGApiZ6HpmGBdb8E",authDomain:"live-location-fdc03.firebaseapp.com",databaseURL:"https://live-location-fdc03-default-rtdb.firebaseio.com/",projectId:"live-location-fdc03",storageBucket:"live-location-fdc03.firebasestorage.app",messagingSenderId:"60312713615",appId:"1:60312713615:web:8508e5794fed95b61bf3fa",measurementId:"G-42RP9TQZYJ"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
const OWNER_EMAIL="rohithkp1901@gmail.com",OWNER_GITHUB="rohithkp1901";
const params=new URLSearchParams(location.search);
const ownerMode=params.get("owner")==="1"||localStorage.getItem("ownerLocationAuth")==="true";
let myTZ="Asia/Kolkata",youTZ=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC";
let ownerGpsStarted=false,ownerAuthInProgress=false,ownerListenerStarted=false;
function fmt(t){return new Date().toLocaleTimeString("en-US",{timeZone:t,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true})}
function tick(){$("my-clock").textContent=fmt(myTZ);$("you-clock").textContent=fmt(youTZ)}
function coords(lat,lon){return Math.abs(+lat).toFixed(4)+"° "+(+lat>=0?"N":"S")+", "+Math.abs(+lon).toFixed(4)+"° "+(+lon>=0?"E":"W")}
function unique(a){return[...new Set(a.filter(Boolean).map(x=>String(x).trim()).filter(Boolean))]}
function district(d){const a=[...(d?.localityInfo?.administrative||[]),...(d?.localityInfo?.informative||[])],state=String(d?.principalSubdivision||"").trim().toLowerCase(),loc=String(d?.locality||"").trim().toLowerCase(),city=String(d?.city||"").trim().toLowerCase();if(state==="kerala"&&(loc==="kanayannur"||city==="kanayannur"))return"Ernakulam";const c=a.filter(x=>x?.name&&String(x.name).trim().toLowerCase()!==state);return c.find(x=>+x.adminLevel===6)?.name||c.find(x=>/district|county/i.test(x.description||""))?.name||c.find(x=>String(x.name).trim().toLowerCase()==="ernakulam")?.name||""}
function parts(d){const loc=d?.locality||d?.city||"",city=d?.city||"";return unique([loc,city.toLowerCase()!==loc.toLowerCase()?city:"",district(d),d?.principalSubdivision,d?.countryName])}
async function reverse(lat,lon){try{const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);if(!r.ok)throw Error();return await r.json()}catch{return null}}
function githubProfile(user,popupResult=null){const provider=user?.providerData?.find(p=>p.providerId==="github.com"),profile=popupResult?.additionalUserInfo?.profile||{};return{email:(user?.email||provider?.email||profile.email||"").toLowerCase(),username:String(profile.login||provider?.displayName||profile.login||"").toLowerCase()}}
function isOwner(user,result=null){const p=githubProfile(user,result);return p.email===OWNER_EMAIL.toLowerCase()||p.username===OWNER_GITHUB.toLowerCase()}
function startOwnerGPS(){if(ownerGpsStarted)return;if(!navigator.geolocation){$("my-pin").textContent="GPS NOT SUPPORTED";$("my-meta").textContent="OWNER DEVICE HAS NO GPS";return}ownerGpsStarted=true;$("my-pin").textContent="LOCATING OWNER...";$("my-meta").textContent="REQUESTING OWNER GPS";navigator.geolocation.watchPosition(async p=>{const{latitude,longitude,accuracy}=p.coords,geo=await reverse(latitude,longitude),place=geo?parts(geo).join(", "):"";$("my-coords").textContent=coords(latitude,longitude);$("my-pin").textContent=place||"OWNER LOCATION UPDATING...";$("my-meta").textContent=`● LIVE · ACCURACY ±${Math.round(accuracy||0)} m`;try{const r=ref(db,"owner");await set(r,{latitude,longitude,accuracy,place,online:true,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC",updatedAt:serverTimestamp(),ownerGithub:OWNER_GITHUB});onDisconnect(r).update({online:false}).catch(console.error)}catch(e){console.error("Firebase owner publish failed",e);$("my-meta").textContent=`● GPS LIVE · FIREBASE WRITE FAILED · ${e.code||"ERROR"}`}},e=>{console.error("Owner GPS error",e);ownerGpsStarted=false;$("my-meta").textContent=e.code===1?"OWNER GPS PERMISSION REQUIRED":"OWNER GPS UNAVAILABLE"},{enableHighAccuracy:true,maximumAge:0,timeout:30000})}
const githubProvider=new GithubAuthProvider();githubProvider.setCustomParameters({allow_signup:"false"});
async function handleOwnerUser(user,result=null){if(!user)return false;const p=githubProfile(user,result);if(isOwner(user,result)){localStorage.setItem("ownerLocationAuth","true");$("my-pin").textContent="OWNER VERIFIED — STARTING GPS...";$("my-meta").textContent=`● GITHUB @${p.username||OWNER_GITHUB} · VERIFIED`;startOwnerGPS();return true}localStorage.removeItem("ownerLocationAuth");await signOut(auth);$("my-pin").textContent="OWNER ACCOUNT REQUIRED";$("my-meta").textContent=`GITHUB @${p.username||"UNKNOWN"} IS NOT THE OWNER`;return false}
async function ownerLogin(){if(!ownerMode||ownerAuthInProgress)return;ownerAuthInProgress=true;try{if(auth.currentUser){const ok=await handleOwnerUser(auth.currentUser);if(ok){ownerAuthInProgress=false;return}}$("my-pin").textContent="OPENING GITHUB LOGIN...";$("my-meta").textContent="OWNER SIGN-IN — PLEASE COMPLETE GITHUB LOGIN";const result=await signInWithPopup(auth,githubProvider);ownerAuthInProgress=false;await handleOwnerUser(result.user,result)}catch(e){console.error("Owner GitHub popup sign-in failed",e);ownerAuthInProgress=false;$("my-pin").textContent="OWNER SIGN-IN FAILED";$("my-meta").textContent=`${e.code||"AUTH ERROR"} — ${e.message||"CHECK FIREBASE GITHUB PROVIDER"}`}}
function startOwnerListener(){if(ownerListenerStarted||ownerMode)return;ownerListenerStarted=true;const ownerRef=ref(db,"owner");onValue(ownerRef,async snap=>{const d=snap.val();console.log("Visitor owner snapshot:",d);if(!d||d.online===false){$("my-pin").textContent="WAITING FOR OWNER LOCATION";$("my-meta").textContent="OWNER IS NOT CURRENTLY SHARING GPS";return}if(d.latitude!=null&&d.longitude!=null){$("my-coords").textContent=coords(d.latitude,d.longitude);const geo=await reverse(d.latitude,d.longitude);const livePlace=geo?parts(geo).join(", "):"";$("my-pin").textContent=livePlace||d.place||"OWNER LOCATION UPDATING..."}else{$("my-pin").textContent=d.place||"OWNER LOCATION UPDATING..."}myTZ=d.timezone||myTZ;$("my-meta").textContent=`● LIVE · ACCURACY ±${Math.round(+d.accuracy||0)} m`;tick()},e=>{console.error("Owner location read failed",e);$("my-pin").textContent="OWNER LOCATION UNAVAILABLE";$("my-meta").textContent=`FIREBASE READ FAILED · ${e.code||"ERROR"}`})}
onAuthStateChanged(auth,async user=>{if(ownerMode){if(user&&!ownerGpsStarted)await handleOwnerUser(user);else if(!user&&!ownerAuthInProgress)await ownerLogin()}else startOwnerListener()});
async function startVisitorAuth(){if(ownerMode)return;try{if(!auth.currentUser)await signInAnonymously(auth)}catch(e){console.warn("Anonymous visitor auth unavailable",e)}startOwnerListener()}
function ip(){fetch("https://ipapi.co/json/").then(r=>r.json()).then(d=>{$("you-pin").textContent=unique([d.city,d.region,d.country_name]).join(", ");if(d.latitude!=null)$("you-coords").textContent=coords(d.latitude,d.longitude);youTZ=d.timezone||youTZ;$("you-meta").textContent=youTZ.toUpperCase();$("you-source").textContent="SOURCE: IP-BASED";tick()}).catch(()=>$("you-pin").textContent="Location unavailable")}
function gps(){if(!navigator.geolocation){ip();return}navigator.geolocation.getCurrentPosition(p=>{const{latitude,longitude}=p.coords;$("you-coords").textContent=coords(latitude,longitude);reverse(latitude,longitude).then(d=>$("you-pin").textContent=d?parts(d).join(", "):"Location name unavailable");youTZ=Intl.DateTimeFormat().resolvedOptions().timeZone||youTZ;$("you-meta").textContent=youTZ.toUpperCase();$("you-source").textContent="SOURCE: GPS"},ip,{enableHighAccuracy:true,timeout:20000,maximumAge:0});tick()}
gps();setInterval(tick,1000);startVisitorAuth();if(ownerMode)setTimeout(ownerLogin,700);
</script>
</body>
</html>
