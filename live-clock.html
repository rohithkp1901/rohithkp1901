<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rohith K P — Live System Clock</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05080c;color:#00ff41;font-family:Consolas,monospace;overflow:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,255,65,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,65,.035) 1px,transparent 1px);background-size:28px 28px;animation:grid 8s linear infinite}@keyframes grid{to{background-position:28px 28px}}.card{position:relative;width:min(900px,92vw);padding:42px;border:1px solid #163d25;border-radius:16px;background:rgba(5,12,9,.9);box-shadow:0 0 50px rgba(0,255,65,.08),inset 0 0 50px rgba(0,255,65,.025);text-align:center}.top{display:flex;justify-content:space-between;color:#6d8b78;font-size:13px;letter-spacing:2px}.live{color:#00ff41}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00ff41;box-shadow:0 0 15px #00ff41;animation:pulse .8s infinite}@keyframes pulse{50%{opacity:.15;transform:scale(.7)}}h1{font-size:clamp(42px,9vw,96px);letter-spacing:5px;margin:65px 0 10px;text-shadow:0 0 18px rgba(0,255,65,.55)}.date{color:#91a99a;font-size:16px}.zone{margin-top:28px;color:#00ff41;font-size:13px;letter-spacing:3px}.bar{height:2px;background:#10271a;margin:35px 0;overflow:hidden}.bar i{display:block;height:100%;width:25%;background:#00ff41;box-shadow:0 0 12px #00ff41;animation:scan 2s linear infinite}@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(500%)}}.footer{color:#52685a;font-size:11px;letter-spacing:2px}
</style></head>
<body><main class="card"><div class="top"><span>ROHITHKP // SYSTEM CLOCK</span><span class="live"><i class="dot"></i> LIVE</span></div><h1 id="time">00:00:00 AM</h1><div class="date" id="date">Loading...</div><div class="zone">ASIA/KOLKATA · IST · UTC+05:30</div><div class="bar"><i></i></div><div class="footer">REAL-TIME CLOCK · AUTO REFRESH · SYSTEM ONLINE</div></main><script>const z='Asia/Kolkata';function tick(){const d=new Date();document.getElementById('time').textContent=new Intl.DateTimeFormat('en-IN',{timeZone:z,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}).format(d);document.getElementById('date').textContent=new Intl.DateTimeFormat('en-IN',{timeZone:z,weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(d)}tick();setInterval(tick,1000)</script></body></html>
