<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rohith K P — Live System Clock</title>
<style>
  :root {
    --neon: #00ff41;
    --bg: #05080b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--neon);
    font-family: "Courier New", Courier, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 255, 65, 0.04) 0px,
      rgba(0, 255, 65, 0.04) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
  }
  .panel {
    text-align: center;
    padding: 40px 60px;
    border: 1px solid var(--neon);
    border-radius: 6px;
    box-shadow: 0 0 12px rgba(0, 255, 65, 0.35), inset 0 0 20px rgba(0, 255, 65, 0.05);
    background: rgba(0, 255, 65, 0.02);
    max-width: 90vw;
  }
  .tag {
    font-size: 13px;
    letter-spacing: 3px;
    opacity: 0.8;
    margin-bottom: 22px;
  }
  .clock {
    font-size: 56px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px var(--neon), 0 0 20px var(--neon);
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
  }
  .date {
    font-size: 15px;
    opacity: 0.75;
    margin-bottom: 18px;
    letter-spacing: 1px;
  }
  .meta {
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.7;
  }
  .footer {
    margin-top: 22px;
    font-size: 11px;
    letter-spacing: 2px;
    opacity: 0.55;
  }
  .blink { animation: blink 1.4s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>
  <div class="panel">
    <div class="tag">ROHITHKP // SYSTEM CLOCK LIVE</div>
    <div class="clock" id="clock">00:00:00 AM</div>
    <div class="date" id="date">--</div>
    <div class="meta">ASIA/KOLKATA · IST · UTC+05:30</div>
    <div class="footer"><span class="blink">●</span>&nbsp; REAL-TIME CLOCK · AUTO REFRESH · SYSTEM ONLINE</div>
  </div>

  <script>
    function tick() {
      const now = new Date();
      const timeOpts = {
        timeZone: "Asia/Kolkata",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      };
      const dateOpts = {
        timeZone: "Asia/Kolkata",
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      };
      document.getElementById("clock").textContent =
        now.toLocaleTimeString("en-US", timeOpts);
      document.getElementById("date").textContent =
        now.toLocaleDateString("en-US", dateOpts).toUpperCase();
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
