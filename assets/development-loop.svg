<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Automatically cycling development loop"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070a0f"/><stop offset=".5" stop-color="#0d141b"/><stop offset="1" stop-color="#070a0f"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="small" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#18212a"/></pattern></defs><rect width="1000" height="300" rx="14" fill="url(#bg)"/><rect x="1" y="1" width="998" height="298" rx="13" fill="url(#grid)" opacity=".55"/><rect x="1" y="1" width="998" height="298" rx="13" fill="none" stroke="#2b3742"/><text x="30" y="38" fill="#e7eef5" font-family="monospace" font-size="20" font-weight="700">06 — DEVELOPMENT LOOP</text><circle cx="930" cy="31" r="5" fill="#00ff41" filter="url(#glow)"><animate attributeName="opacity" values="1;.1;1" dur=".65s" repeatCount="indefinite"/></circle><text x="945" y="36" fill="#00ff41" font-family="monospace" font-size="11">AUTO</text><g font-family="monospace" text-anchor="middle"><rect x="30" y="82" width="140" height="78" rx="8" fill="#0d151c" stroke="#34424e"/><rect x="225" y="82" width="140" height="78" rx="8" fill="#0d151c" stroke="#34424e"/><rect x="420" y="82" width="140" height="78" rx="8" fill="#0d151c" stroke="#34424e"/><rect x="615" y="82" width="140" height="78" rx="8" fill="#0d151c" stroke="#34424e"/><rect x="810" y="82" width="140" height="78" rx="8" fill="#0d151c" stroke="#34424e"/><text x="100" y="112" fill="#65737e" font-size="10">01</text><text x="100" y="14