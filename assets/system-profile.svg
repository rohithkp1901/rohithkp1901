<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="430"
  viewBox="0 0 900 430"
>

  <rect
    width="900"
    height="430"
    rx="14"
    fill="#080d12"
  />

  <!-- Terminal border -->

  <rect
    x="25"
    y="25"
    width="850"
    height="380"
    rx="10"
    fill="none"
    stroke="#26323c"
    stroke-width="2"
  />

  <!-- Terminal header -->

  <circle cx="52" cy="52" r="7" fill="#ff5f56"/>
  <circle cx="76" cy="52" r="7" fill="#ffbd2e"/>
  <circle cx="100" cy="52" r="7" fill="#27c93f"/>

  <text
    x="130"
    y="58"
    fill="#8b949e"
    font-family="monospace"
    font-size="15"
  >
    root@rohithkp:~ / developer.conf
  </text>

  <!-- Terminal command -->

  <text
    x="55"
    y="105"
    fill="#00ff41"
    font-family="monospace"
    font-size="17"
  >
    root@rohithkp:~$
  </text>

  <text
    x="225"
    y="105"
    fill="#ffffff"
    font-family="monospace"
    font-size="17"
  >
    cat /etc/developer.conf
  </text>

  <!-- Profile title -->

  <text
    x="55"
    y="150"
    fill="#00ff41"
    font-family="monospace"
    font-size="20"
    font-weight="bold"
  >
    &gt;&gt; DEVELOPER PROFILE
  </text>

  <!-- Name -->

  <text
    x="55"
    y="190"
    fill="#8b949e"
    font-family="monospace"
    font-size="16"
  >
    NAME
  </text>

  <text
    x="190"
    y="190"
    fill="#ffffff"
    font-family="monospace"
    font-size="16"
  >
    Rohith K P
  </text>

  <!-- Role -->

  <text
    x="55"
    y="220"
    fill="#8b949e"
    font-family="monospace"
    font-size="16"
  >
    ROLE
  </text>

  <text
    x="190"
    y="220"
    fill="#ffffff"
    font-family="monospace"
    font-size="16"
  >
    Software Developer
  </text>

  <!-- Mode -->

  <text
    x="55"
    y="250"
    fill="#8b949e"
    font-family="monospace"
    font-size="16"
  >
    MODE
  </text>

  <text
    x="190"
    y="250"
    fill="#ffffff"
    font-family="monospace"
    font-size="16"
  >
    Full Stack
  </text>

  <!-- Stack -->

  <text
    x="55"
    y="280"
    fill="#8b949e"
    font-family="monospace"
    font-size="16"
  >
    STACK
  </text>

  <text
    x="190"
    y="280"
    fill="#ffffff"
    font-family="monospace"
    font-size="16"
  >
    Python / React / Angular
  </text>

  <!-- Backend -->

  <text
    x="55"
    y="310"
    fill="#8b949e"
    font-family="monospace"
    font-size="16"
  >
    BACKEND
  </text>

  <text
    x="190"
    y="310"
    fill="#ffffff"
    font-family="monospace"
    font-size="16"
  >
    Django / Flask / REST APIs
  </text>

  <!-- IoT -->

  <text
    x="55"
    y="340"
    fill="#8b949e"
    font-family="monospace"
    font-size="16"
  >
    IoT
  </text>

  <text
    x="190"
    y="340"
    fill="#ffffff"
    font-family="monospace"
    font-size="16"
  >
    ESP32 / Raspberry Pi / Firebase
  </text>

  <!-- Current project -->

  <text
    x="55"
    y="370"
    fill="#8b949e"
    font-family="monospace"
    font-size="16"
  >
    CURRENT
  </text>

  <text
    x="190"
    y="370"
    fill="#00ff41"
    font-family="monospace"
    font-size="16"
    font-weight="bold"
  >
    ALEMS
  </text>

  <!-- Animated status light -->

  <circle
    cx="790"
    cy="370"
    r="8"
    fill="#00ff41"
  >
    <animate
      attributeName="opacity"
      values="1;0.15;1"
      dur="0.8s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="810"
    y="376"
    fill="#00ff41"
    font-family="monospace"
    font-size="14"
  >
    ONLINE
  </text>

  <!-- Cursor -->

  <rect
    x="55"
    y="385"
    width="10"
    height="18"
    fill="#00ff41"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.7s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
