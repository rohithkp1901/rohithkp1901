<svg xmlns="http://www.w3.org/2000/svg" width="950" height="360" viewBox="0 0 950 360"><defs><filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="scan" x1="0" x2="1"><stop offset="0" stop-opacity="0"/><stop offset=".5" stop-opacity=".8"/><stop offset="1" stop-opacity="0"/></linearGradient><style>@keyframes blink{0%,45%,100%{opacity:1}50%{opacity:.18}}@keyframes rise{0%{opacity:0;transform:translateY(12px)}12%,78%{opacity:1;transform:translateY(0)}90%,100%{opacity:.35;transform:translateY(-3px)}}@keyframes sweep{0%{transform:translateX(-900px);opacity:0}12%{opacity:.7}50%{opacity:.15}88%{opacity:.7}100%{transform:translateX(900px);opacity:0}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes cursor{0%,45%{opacity:1}50%,100%{opacity:0}}.line{animation:rise 4.8s infinite}.l2{animation-delay:.35s}.l3{animation-delay:.7s}.l4{animation-delay:1.05s}.prompt{animation:blink 2.2s infinite}.cur{animation:cursor .8s steps(1) infinite}.sweep{animation:sweep 3.8s linear infinite}.node{animation:pulse 1.8s ease-in-out infinite}.node2{animation-delay:.6s}.node3{animation-delay:1.2s}.node4{animation-delay:1.8s}</style></defs><rect width="950" height="360" rx="14" fill="#010601" stroke="#00ff41" stroke-width="2"/><g font-family="monospace" text-anchor="middle"><text x="475" y="75" fill="#55ff88" font-size="11" class="prompt">root@rohithkp:~$ philosophy --execute<tspan class="cur"> ▌</tspan></text><g fill="#00ff41" font-size="25" font-weight="700" filter="url(#glow)"><text x="475" y="135" class="line">KEEP LEARNING.</text><text x="475" y="180" class="line l2">KEEP BUILDING.</text><text x="475" y="225" class="line l3">KEEP TESTING.</text><text x="475" y="270" class="line l4">KEEP IMPROVING.</text></g><g opacity=".25"><rect x="25" y="112" width="900" height="3" fill="url(#scan)" class="sweep"/></g><g stroke="#00ff41" fill="none" opacity=".5"><path d="M90 135H125 M825 135H860 M90 270H125 M825 270H860"/><path d="M125 135v-16h40 M825 135v-16h-40 M125 270v16h40 M825 270v16h-40"/></g><g fill="#00ff41"><circle cx="110" cy="150" r="2" class="node"/><circle cx="840" cy="195" r="2" class="node node2"/><circle cx="110" cy="245" r="2" class="node node3"/><circle cx="840" cy="260" r="2" class="node node4"/></g><text x="475" y="320" fill="#55ff88" font-size="10">BUILD → TEST → DEBUG → IMPROVE → SHIP</text><path d="M250 332H700" stroke="#00ff41" opacity=".2" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" from="0" to="-52" dur="1.2s" repeatCount="indefinite"/></path></g></svg>